
<div class="cart-container">
  <h2>🛒 Carrito de Viajes</h2>

  <table *ngIf="cart.length > 0">
    <thead>
      <tr>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Subtotal</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of cart">
        <td>{{ item.description }}</td>
        <td>{{ item.price | currency:'ARS':'symbol' }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.price * item.quantity | currency:'ARS':'symbol' }}</td>
        <td>
          <button (click)="eliminarItem(item.id)">🗑️ Quitar</button>
        </td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3" class="total-label">Total</td>
        <td colspan="2" class="total-value">{{ getTotal() | currency:'ARS':'symbol' }}</td>
      </tr>
    </tfoot>
  </table>

  <div *ngIf="cart.length === 0" class="empty-cart">
    Tu carrito está vacío.
  </div>
</div>
