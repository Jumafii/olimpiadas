<div class="container py-5">
  <h2 class="text-center fw-bold mb-5" style="color: #3b5d50;">Nuestros Productos</h2>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let product of products">
      <div class="card border-0 shadow-sm" style="border-radius: 16px;">
        <div class="card-body text-center">
          <h5 class="fw-bold" style="color: #3b5d50;">{{ product.name }}</h5>
          <p class="text-muted small">{{ product.description }}</p>
          <p class="fw-semibold" style="color: #f9bf29;">$ {{ product.price }}</p>
          <button class="btn btn-custom" (click)="addToCart(product)">Agregar al carrito</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="container py-5">
  <h2 class="text-center fw-bold mb-5" style="color: #3b5d50;">Carrito de Compras</h2>
  <div class="row">
    <div class="col-md-12">
      <app-cart></app-cart>
    </div>
  </div>
